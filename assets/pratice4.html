<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
      * {
        margin: 0;
        padding: 0;
      }

      body {
        padding: 10px;
      }

      .bx {
        width: 350px;
        height: 370px;
        box-sizing: border-box;
        background-color: red;
        text-align: center;
        border-radius: 20px;
        overflow: hidden;
      }

      img {
        height: 200px;
        width: 100%;
        object-fit: cover;
        filter: grayscale(50%) blur(0px) brightness(90px);
      }

      .p {
        text-decoration: none;
        width: 20px;
        height: 20px;
      }

      .bx h2 {
        color: purple;

      }
    </style>


  </head>

  <body>
    <div class="bx">
      <img src="download.jpg" alt="">
      <h2>4 days ago</h2>
      <h1>Post One</h1>

      <p>Lorem ipsum dolor sit, amet consectetur adipisicing elit. A assumenda numquam quidem nemo tenetur officiis,
        voluptas reprehenderit possimus labore sit rerum cupiditate, minus excepturi nam reiciendis aut quibusdam ex
        sapiente?</p>
    </div>

  </body>

</html>
