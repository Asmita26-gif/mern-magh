<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        background-image: url();
      }

      .navbar {
        font-family: Arial, Helvetica, sans-serif;
        background-color: skyblue;
        display: flex;
        padding-left: 20px;
        padding-right: 20px;
        height: 100%;
        width: 100%;

      }

      .logo {
        font-family: cursive;
        font-size: 30px;
        font-weight: bold;
        color: darkred;
      }

      menu {
        display: flex;
        text-decoration: none;
        align-items: center;
        padding-left: 20px;
        padding-right: 20px;
      }

      li {
        display: inline-block;
        list-style: none;

      }

      li a {
        font-size: 20px;
        justify-content: center;
        text-align: center;
        color: black;
        display: flex;
        margin-left: 20px;
        padding-left: 20px;
        padding-right: 20px;
      }

  </head>

  <body>
    <div class="navbar">
      <div class="logo">Food Hub</div>
      <div class="menu">
        <li><a href="#">Home</a></li>
        <li><a href="#">Contact</a></li>
        <li><a href="#">Address</a></li>
        <li><a href="#">Services</a></li>

        <li><a href="#">Content</a></li>

</html>
