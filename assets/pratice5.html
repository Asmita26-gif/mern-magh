<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        padding: 10px;


      }

      main {
        /* max-width: 500px; */
        border: 1px solid black;
        display: flex;
        /* justify-content: space-between;
        /* height: 200px; */
        /* align-items: center; */
        flex-direction: flex;



      }

      .bx1 {
        background-color: palevioletred;
        flex-basis: 200px;
        flex-shrink: 2;
        /* align-self: flex-end; */
      }

      .bx2 {
        background-color: yellow;
        order: 7;
      }

      .bx3 {
        background-color: olive;
        order: 5;
      }

      .bx4 {
        background-color: orangered;
        order: 6;
      }

      .bx5 {
        background-color: red;
        order: 1;
      }

      .bx6 {
        background-color: green;
        order: 3;
      }

      .bx7 {
        background-color: blue;
        order: 4;
      }
    </style>
  </head>

  <body>
    <h1>FlexCss</h1>
    <main>
      <div class="bx1">
        <h3>bx1</h3>
      </div>


      <div class="bx2 item">
        <h3>bx2</h3>
      </div>

      <div class="bx3 item">
        <h3>bx3</h3>
      </div>

      <div class="bx4 item">
        <h3>bx4</h3>
      </div>

      <div class="bx5 item">
        <h3>bx5</h3>
      </div>

      <div class="bx6 item">
        <h3>bx6</h3>
      </div>

      <div class="bx7 item">
        <h3>bx7</h3>
      </div>
    </main>

  </body>

</html>
