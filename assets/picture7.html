<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
      * {
        text-decoration: none;
      }

      .navbar {
        background-color: crimson;
        font-family: calibri;
        padding-right: 20px;
        padding-left: 20px;
      }

      .nav {
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      .logo {
        font-size: 40px;
        font-weight: bold;
        color: white;
      }

      li {
        list-style: none;
        display: inline-block;
      }

      li a {
        color: white;
        font-size: 20px;
        font-weight: bold;
        margin-right: 25px;
      }

      button {
        background-color: black;
        margin-left: 15px;
        border-radius: 10px;
        padding: 10px;
        width: 90px;
      }

      button a {
        color: white;
        font-weight: bold;
        font-size: 15px;
      }
    </style>
  </head>

  <body>
    <nav class="navbar">
      <div class="nav">
        <div class="logo">WebTech</div>
        <ul>
          <li><a href="#">HOME</a></li>
          <li><a href="#">CONTACT US</a></li>
          <li><a href="#">ABOUT</a></li>
          <li><a href="#">SERVICES</a></li>
          <button><a href="#">SignIN</a></button>
          <button><a href="#">SignUp</a></button>
        </ul>
      </div>

    </nav>

  </body>

</html>
