<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Css grid layout</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        padding: 20px;
      }

      .box {
        width: 300px;
        border: 2px solid black;
        background-color: black;
        display: grid;
        grid-template-columns: 250px;
        grid-template-rows: 50px 40px 100px 150px 50px;
        gap: 10px;
        text-decoration: white;
        justify-content: center;
        flex-direction: column;
        text-align: center;
        padding-top: 20px;
      }

      /* .box {
        background-color: tomato;
        border: 2px solid black;
        width: 300px;
        height: 600px;
        align-items: center;
        justify-content: center;
        text-align: center;
        display: grid;
      } */

      .bx1 {
        background-color: blue;
        text-align: center;
        padding-top: 10px;
      }

      .bx2 {
        background-color: brown;
        text-align: center;
        padding-top: 10px;
      }

      .bx3 {
        background-color: chocolate;
        text-align: center;
        padding-top: 30px;
      }

      .bx4 {
        background-color: darkcyan;
        text-align: center;
        padding-top: 50px;
      }

      .bx5 {
        background-color: orangered;
        text-align: center;
        padding-top: 10px;
      }
    </style>
  </head>

  <body>

    <div class="box">
      <div class="bx1">
        <h2>Header</h2>
      </div>
      <div class="bx2">
        <h2>Nav</h2>
      </div>
      <div class="bx3">
        <h2>MAin</h2>
      </div>
      <div class="bx4">
        <h2>Subcontent</h2>
      </div>
      <div class="bx5">
        <h2>Footer</h2>
      </div>

    </div>


  </body>

</html>
