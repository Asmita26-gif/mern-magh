<!DOCTYPE html>
<html>

  <head>
    <style>
      .container {
        display: grid;
        grid-template-areas:
          "header header"
          "menu content"
          "footer footer";
        grid-template-columns: 1fr 3fr;
        gap: 5px;
        background-color: #2196F3;
        padding: 5px;
      }

      .container>div {
        background-color: rgba(255, 255, 255, 0.8);
        padding: 10px;
      }

      .container>div.header {
        grid-area: header;
        text-align: center;
        background-color: purple;
      }

      .container>div.sidebar {
        grid-area: span;
        background-color: blue;
      }

      .container>div.content {
        grid-area: content;
        background-color: tomato;
      }



      .container>div.footer {
        grid-area: footer;
        text-align: center;
        background-color: purple;
      }
    </style>
  </head>

  <body>

    <h1>CSS Grid Layout</h1>



    <div class="container">
      <div class="header">
        <h2>My Header</h2>
      </div>
      <div class="sidebar">
        <h2>Sidebar</h2>
      </div>
      <div class="content">
        <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Quia a iure porro quae provident cum alias delectus
          enim? Iste laborum perspiciatis quos magni ipsum? Recusandae vitae ipsum distinctio incidunt earum.</p>
      </div>
      <div class="footer">
        <h2>Footer</h2>
      </div>
    </div>

  </body>

</html>
